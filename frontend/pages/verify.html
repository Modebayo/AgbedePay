<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify your phone — AgbedePay</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" type="image/svg+xml" href="../brand/favicon.svg" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="brand brand--center">
      <span class="brand__mark" aria-hidden="true"><img src="../brand/symbol.svg" alt="" draggable="false" /></span>
      <span class="brand__name">AgbedePay</span>
    </div>

    <h1 class="auth-title">Verify your phone</h1>
    <p class="auth-sub">We sent a 6-digit code to <strong id="verify-phone-display">your phone</strong>.
    In development the code is printed to the <strong>server console</strong> — look for <code>[DEV/MOCK OTP]</code>.</p>

    <form class="form" id="verify-form" novalidate>
      <div class="error-banner" role="alert"></div>

      <div class="field">
        <label class="field__label" for="code">Verification code</label>
        <input class="input" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required />
        <p class="field__error"></p>
      </div>

      <button class="btn btn--primary" id="verify-submit" type="submit">Verify phone</button>
    </form>

    <p class="auth-alt">
      Didn't get it?
      <button type="button" id="resend-btn" class="link-btn">Resend code</button>
    </p>
    <p class="auth-alt"><a href="login.html">Back to login</a></p>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/verify.js"></script>
</body>
</html>
