<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Statements — AgbedePay</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" type="image/svg+xml" href="../brand/favicon.svg" />
  <script>try{if(localStorage.getItem("agbe_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="dashboard.html">
        <span class="brand__mark" aria-hidden="true"><img src="../brand/symbol.svg" alt="" draggable="false" /></span>
        <span class="brand__name">AgbedePay</span>
      </a>
      <div class="topbar__right" data-topbar-right></div>
    </header>

    <main class="page" id="page">
      <div class="section-head"><h2>Monthly statements</h2></div>
      <p class="page-sub">Download a CSV of everything that moved in a date range, for records, tax and loan applications.</p>

      <form class="form card" id="statement-form" novalidate>
        <div class="error-banner" role="alert"></div>

        <div class="field">
          <label class="field__label" for="st-from">From</label>
          <input class="input" id="st-from" name="from" type="date" required />
          <p class="field__error"></p>
        </div>

        <div class="field">
          <label class="field__label" for="st-to">To</label>
          <input class="input" id="st-to" name="to" type="date" required />
          <p class="field__error"></p>
        </div>

        <button class="btn btn--green" id="statement-submit" type="submit"></button>
      </form>
    </main>


    <div class="ad-ticker" data-ad-ticker aria-hidden="true"></div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/statements.js"></script>
</body>
</html>
